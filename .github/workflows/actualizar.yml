name: Actualizar YouTube IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar yt-dlp
        run: |
          python3 -m pip install -U "yt-dlp[default]"

      - name: Obtener URL del directo
  run: |
    URL="https://www.youtube.com/live/L2KqXC9ZpX4"

    echo "Probando yt-dlp..."
    yt-dlp --version

    echo "Obteniendo formatos..."
    yt-dlp \
      --js-runtimes deno \
      --remote-components ejs:github \
      --list-formats \
      "$URL"

    echo "Obteniendo URL..."
    yt-dlp \
      --js-runtimes deno \
      --remote-components ejs:github \
      -g \
      -f 232 \
      "$URL"

      - name: Guardar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lista.m3u

          if git diff --cached --quiet; then
            echo "No hubo cambios."
          else
            git commit -m "Actualizar URL YouTube"
            git push
          fi
